<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1b75bc" />

  <!-- PWA / instalable como app -->

  <!-- iOS: abrir en pantalla completa (standalone) y nombre bajo el ícono -->

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />

  <!-- iOS: ícono de la pantalla de inicio -->
  <link rel="apple-touch-icon" href="assets/icons/icon-180.png" />
  <link rel="apple-touch-icon" sizes="152x152" href="assets/icons/icon-152.png" />
  <link rel="apple-touch-icon" sizes="167x167" href="assets/icons/icon-167.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/icon-180.png" />

  <!-- iOS: imagen mientras arranca la app instalada (si no, iOS muestra una pantalla en blanco).
       Generadas con el logo de la pantalla de carga, en la misma posición; una por tamaño de pantalla -->
  <link rel="apple-touch-startup-image" href="assets/splash/splash-640x1136.png" media="(device-width: 320px) and (device-height: 568px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
  <link rel="apple-touch-startup-image" href="assets/splash/splash-750x1334.png" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
  <link rel="apple-touch-startup-image" href="assets/splash/splash-1242x2208.png" media="(device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
  <link rel="apple-touch-startup-image" href="assets/splash/splash-1125x2436.png" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
  <link rel="apple-touch-startup-image" href="assets/splash/splash-828x1792.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
  <link rel="apple-touch-startup-image" href="assets/splash/splash-1242x2688.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
  <link rel="apple-touch-startup-image" href="assets/splash/splash-1170x2532.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
  <link rel="apple-touch-startup-image" href="assets/splash/splash-1284x2778.png" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
  <link rel="apple-touch-startup-image" href="assets/splash/splash-1179x2556.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
  <link rel="apple-touch-startup-image" href="assets/splash/splash-1290x2796.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
  <link rel="apple-touch-startup-image" href="assets/splash/splash-1206x2622.png" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
  <link rel="apple-touch-startup-image" href="assets/splash/splash-1320x2868.png" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
  <link rel="apple-touch-startup-image" href="assets/splash/splash-1536x2048.png" media="(device-width: 768px) and (device-height: 1024px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
  <link rel="apple-touch-startup-image" href="assets/splash/splash-1620x2160.png" media="(device-width: 810px) and (device-height: 1080px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
  <link rel="apple-touch-startup-image" href="assets/splash/splash-1640x2360.png" media="(device-width: 820px) and (device-height: 1180px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
  <link rel="apple-touch-startup-image" href="assets/splash/splash-1668x2388.png" media="(device-width: 834px) and (device-height: 1194px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
  <link rel="apple-touch-startup-image" href="assets/splash/splash-2048x2732.png" media="(device-width: 1024px) and (device-height: 1366px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
  <!-- Pantalla de carga: se pinta al instante (sin esperar a nada externo) y Angular la reemplaza al arrancar -->
  <style>
    html, body { margin: 0; background: #F3F5F9; }
    /* El logo queda justo en el centro de la pantalla, igual que en las imágenes de arranque de iOS
       (assets/splash): al pasar de una a otra no se mueve, solo aparecen el nombre y la barra */
    .splash { position: fixed; inset: 0; background: #F3F5F9; color: #0F2A4A; }
    .splash__logo {
      position: absolute; left: 50%; top: 50%; width: 88px; height: 88px;
      transform: translate(-50%, -50%); animation: splash-latido 1.6s ease-in-out infinite;
    }
    .splash__pie {
      position: absolute; left: 24px; right: 24px; top: calc(50% + 62px);
      display: flex; flex-direction: column; align-items: center; gap: 16px;
      font: 800 20px/1.2 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
      letter-spacing: -0.01em; animation: splash-aparece 0.3s ease both;
    }
    .splash__barra { width: 120px; height: 4px; border-radius: 2px; background: #DCE6F2; overflow: hidden; }
    .splash__barra::after {
      content: ''; display: block; width: 40%; height: 100%; border-radius: 2px; background: #1B75BC;
      animation: splash-carga 1.1s ease-in-out infinite;
    }
    /* Si tarda demasiado (sin conexión o red lenta), se explica en vez de dejar al usuario esperando a ciegas */
    .splash__lento {
      font: 500 14px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif; color: #5B6B82;
      text-align: center; max-width: 260px; opacity: 0; animation: splash-aparece 0.4s ease 6s forwards;
      display: flex; flex-direction: column; align-items: center; gap: 12px;
    }
    .splash__lento button {
      min-height: 44px; padding: 0 22px; border: 0; border-radius: 14px;
      background: #1B75BC; color: #FFFFFF; font: 700 15px system-ui, -apple-system, 'Segoe UI', sans-serif;
    }
    @keyframes splash-carga { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @keyframes splash-latido { 50% { transform: translate(-50%, -50%) scale(0.94); } }
    @keyframes splash-aparece { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .splash__logo { animation: none; }
      .splash__barra::after { animation-duration: 2.4s; }
    }
  </style>

  <!-- Hojas externas: no bloquean el primer pintado; main.ts espera a que carguen antes de mostrar la app -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" media="print" onload="this.media='all'" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet" media="print" onload="this.media='all'">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">

  <title>Hipoteca Simple</title>

</head>
<body>
  <app-root>
    <div class="splash" role="status" aria-label="Cargando Hipoteca Simple">
      <svg class="splash__logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" aria-hidden="true">
        <rect width="120" height="120" rx="27" fill="#1B75BC"/>
        <rect x="35" y="18" width="50" height="86" rx="12" fill="#FFFFFF"/>
        <rect x="51" y="23" width="18" height="5" rx="2.5" fill="#0F2A4A"/>
        <polygon points="44,62 60,47 76,62" fill="#0F2A4A"/>
        <rect x="48" y="61" width="24" height="19" rx="2" fill="#F07A7A"/>
        <rect x="57" y="68" width="6" height="12" rx="1.5" fill="#FFFFFF"/>
        <rect x="45" y="87" width="30" height="3.5" rx="1.75" fill="#CFE3F5"/>
        <rect x="45" y="93" width="19" height="3.5" rx="1.75" fill="#CFE3F5"/>
        <circle cx="88" cy="32" r="14" fill="#FCD34D" stroke="#1B75BC" stroke-width="5"/>
        <text x="88" y="37.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#0F2A4A">$</text>
      </svg>
      <div class="splash__pie">
        <div>Hipoteca Simple</div>
        <div class="splash__barra"></div>
        <div class="splash__lento">
          Está tardando más de lo normal. Revisa tu conexión a internet.
          <button type="button" onclick="location.reload()">Reintentar</button>
        </div>
      </div>
    </div>
  </app-root>
  <script>
    // Vigilante del arranque: si a los 10 s la app sigue sin reemplazar la pantalla de carga (una descarga
    // colgada, p. ej.), recarga sola una vez por sesión, que es lo que lo resuelve. main.ts borra la marca.
    setTimeout(function () {
      if (!document.querySelector('.splash')) return;
      try {
        if (sessionStorage.getItem('hs-reintento')) return;
        sessionStorage.setItem('hs-reintento', '1');
      } catch (e) { return; }
      location.reload();
    }, 10000);
  </script>
</body>
</html>
