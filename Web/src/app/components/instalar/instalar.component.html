<section class="instalar" *ngIf="modo" aria-label="Instalar la app">
  <img class="instalar__logo" src="assets/logo.svg" alt="" width="44" height="44">
  <div class="instalar__texto">
    <div class="instalar__titulo">Instala Hipoteca Simple</div>
    <div class="instalar__sub" *ngIf="modo === 'android'">Ábrela como una app desde tu pantalla de inicio.</div>
    <div class="instalar__sub" *ngIf="modo === 'ios'">
      Toca <i class="fa-solid fa-arrow-up-from-bracket" aria-hidden="true"></i> <strong>Compartir</strong> y luego
      <strong>Añadir a pantalla de inicio</strong>.
    </div>
  </div>
  <button *ngIf="modo === 'android'" type="button" class="hs-btn hs-btn--sm instalar__btn" (click)="instalar()">Instalar</button>
  <button type="button" class="instalar__cerrar" aria-label="No volver a mostrar" (click)="cerrar()">
    <i class="fa-solid fa-xmark" aria-hidden="true"></i>
  </button>
</section>
