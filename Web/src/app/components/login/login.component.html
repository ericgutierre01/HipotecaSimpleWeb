<div class="login">
    <div class="login__body">
        <div class="login__brand">
            <img class="login__logo" src="assets/logo.svg" alt="Hipoteca Simple" width="104" height="104">
            <div>
                <h1 class="login__title">Hipoteca Simple</h1>
                <p class="login__lead">Mira cuánto debes, cuándo terminas y cuánto ahorras con cada abono.</p>
            </div>
        </div>

        <form name="loginform" class="login__form">
            <div class="hs-field">
                <label class="hs-label" for="user">Usuario</label>
                <input type="text" id="user" class="hs-input" placeholder="Tu usuario" autocomplete="username"
                    autocapitalize="none" (keyup)="nextFocus($event, 'pass')" />
            </div>
            <div class="hs-field">
                <label class="hs-label" for="pass">Contraseña</label>
                <div class="hs-input-group login__pass">
                    <input [type]="verClave ? 'text' : 'password'" id="pass" placeholder="••••••••"
                        autocomplete="current-password" (keyup)="nextFocus($event, 'login')" />
                    <button type="button" class="login__eye" (click)="verClave = !verClave"
                        [attr.aria-label]="verClave ? 'Ocultar contraseña' : 'Mostrar contraseña'">
                        <i class="fa-regular" [class.fa-eye]="!verClave" [class.fa-eye-slash]="verClave" aria-hidden="true"></i>
                    </button>
                </div>
            </div>
            <button type="button" class="hs-btn hs-btn--block login__submit" [disabled]="loading" (click)="login()">
                <ng-container *ngIf="!loading">Entrar <i class="fa-solid fa-arrow-right" aria-hidden="true"></i></ng-container>
                <ng-container *ngIf="loading"><i class="fa-solid fa-circle-notch fa-spin" aria-hidden="true"></i> Entrando…</ng-container>
            </button>
        </form>

        <div class="login__links">
            <a routerLink="/Recuperar">¿Olvidaste tu contraseña?</a>
            <a routerLink="/Registro">Crear cuenta</a>
            <a routerLink="/Bienvenido">¿Qué es Hipoteca Simple?</a>
        </div>

        <app-instalar></app-instalar>
    </div>
</div>
